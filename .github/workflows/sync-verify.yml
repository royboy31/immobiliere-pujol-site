name: Daily Sync Verification

on:
  # No `schedule:` here on purpose. GitHub's cron was unreliable (40-75 min late,
  # then dropped entirely after an edit). The daily run is now triggered punctually
  # by the pujol-cron-sync Cloudflare worker (cron '55 6 * * *' → ~09:00 Paris),
  # which calls this workflow via workflow_dispatch with target=pujol. See
  # workers/cron-sync/index.ts (triggerSyncVerify).
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to verify (roy, pujol, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - roy
          - pujol

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled daily run verifies + emails PROD (pujol / live site) only.
        # Manual dispatch can still target roy, pujol, or both.
        target: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'both' && fromJSON('["roy","pujol"]') || fromJSON(format('["{0}"]', inputs.target))) || fromJSON('["pujol"]') }}
    name: verify-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync verification (${{ matrix.target }})
        run: node scripts/sync-verify.mjs --target ${{ matrix.target }} --daily
        env:
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
