name: Daily Sync Verification

on:
  schedule:
    # 06:50 UTC on an off-peak minute (NOT :00, which is GitHub's most congested
    # slot and was starting this run 40-75 min late). Scheduling a bit early + off
    # the hour makes it fire close to on-time so the email lands ~09:00 Paris (CEST).
    # NOTE: GitHub cron is always UTC and ignores DST — in winter (CET) this becomes
    # 07:50 Paris, bump to '50 7 * * *' if you want 09:00 year-round.
    - cron: '50 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to verify (roy, pujol, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - roy
          - pujol

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Scheduled daily run verifies + emails PROD (pujol / live site) only.
        # Manual dispatch can still target roy, pujol, or both.
        target: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'both' && fromJSON('["roy","pujol"]') || fromJSON(format('["{0}"]', inputs.target))) || fromJSON('["pujol"]') }}
    name: verify-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run sync verification (${{ matrix.target }})
        run: node scripts/sync-verify.mjs --target ${{ matrix.target }} --daily
        env:
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
