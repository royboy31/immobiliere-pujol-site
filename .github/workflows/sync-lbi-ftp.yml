name: Sync LBI zip from FTP to R2

on:
  schedule:
    - cron: '30 * * * *'  # Every hour at :30 (before the :00 cron-sync)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download zip from FTP
        run: |
          # Infomaniak FTP is occasionally slow from CI (curl exit 28 = timeout).
          # Bound each attempt (--connect-timeout/--max-time) and spread 5 retries
          # over more time so a transient slow window doesn't fail the run.
          curl -s "ftp://${{ secrets.LBI_FTP_HOST }}/${{ secrets.LBI_FTP_FILE }}" \
            --user "${{ secrets.LBI_FTP_USER }}:${{ secrets.LBI_FTP_PASS }}" \
            --ftp-pasv --connect-timeout 30 --max-time 180 \
            --retry 5 --retry-delay 60 --retry-all-errors --retry-connrefused \
            -o /tmp/lbi_import.zip
          ls -lh /tmp/lbi_import.zip
          # Refuse to upload a partial/corrupt download (would poison R2).
          unzip -t /tmp/lbi_import.zip > /dev/null

      - name: Upload to R2
        run: npx wrangler r2 object put pujol-photos/lbi/import.zip --file=/tmp/lbi_import.zip --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
