name: Deploy to Pujol Account

on:
  workflow_dispatch:

jobs:
  deploy-pujol:
    runs-on: ubuntu-latest
    environment: pujol-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Patch wrangler config for Pujol account
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8').replace(/\/\/.*/g,''));
            cfg.d1_databases[0].database_id = '${{ secrets.D1_DATABASE_ID }}';
            fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "

      - name: Sync D1 annonces to content
        run: node scripts/sync-d1-to-content.mjs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}

      - name: Deploy main worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Patch email worker config for Pujol account
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('workers/email/wrangler.jsonc','utf8').replace(/\/\/.*/g,''));
            cfg.account_id = '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}';
            cfg.vars.ALLOWED_ORIGIN = 'https://immobiliere-pujol-staging.pujol.workers.dev';
            fs.writeFileSync('workers/email/wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "

      - name: Deploy email worker
        working-directory: workers/email
        run: rm -rf ../../.wrangler && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Patch cron-sync worker config for Pujol account
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('workers/cron-sync/wrangler.jsonc','utf8').replace(/\/\/.*/g,''));
            cfg.d1_databases[0].database_id = '${{ secrets.D1_DATABASE_ID }}';
            cfg.vars = cfg.vars || {};
            cfg.vars.DEPLOY_WORKFLOW = 'deploy-pujol.yml';
            fs.writeFileSync('workers/cron-sync/wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "

      - name: Deploy cron-sync worker
        working-directory: workers/cron-sync
        run: rm -rf ../../.wrangler && npm install && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
