name: Deploy to Pujol Account

on:
  push:
    branches: [pujol-main]
  workflow_dispatch:

jobs:
  deploy-pujol:
    runs-on: ubuntu-latest
    environment: pujol-staging
    env:
      ROY_R2_URL: "https://pub-a37eed540afe4dc9b4479da74ba265e1.r2.dev"
      PUJOL_R2_URL: "https://pub-ffb425c962e94d71bef4d2fbce95daee.r2.dev"
      ROY_EMAIL_WORKER: "pujol-email.roy-68a.workers.dev"
      PUJOL_EMAIL_WORKER: "pujol-email.pujol.workers.dev"
      ROY_STAGING: "immobiliere-pujol-staging.roy-68a.workers.dev"
      PUJOL_STAGING: "immobiliere-pujol-staging.pujol.workers.dev"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pujol-main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ── Patch all Roy references to Pujol ──────────────────────────────
      - name: Patch R2 public URL (Roy → Pujol)
        run: |
          echo "Replacing R2 public URL in source files..."
          find src workers scripts -type f \( -name "*.ts" -o -name "*.astro" -o -name "*.mjs" -o -name "*.js" -o -name "*.json" -o -name "*.md" \) \
            -exec sed -i "s|$ROY_R2_URL|$PUJOL_R2_URL|g" {} +
          echo "Replaced in $(grep -rl "$PUJOL_R2_URL" src/ workers/ scripts/ 2>/dev/null | wc -l) files"

      - name: Patch form action URLs (Roy email worker → Pujol)
        run: |
          find src -type f \( -name "*.astro" -o -name "*.ts" -o -name "*.js" \) \
            -exec sed -i "s|$ROY_EMAIL_WORKER|$PUJOL_EMAIL_WORKER|g" {} +
          echo "Replaced in $(grep -rl "$PUJOL_EMAIL_WORKER" src/ 2>/dev/null | wc -l) files"

      - name: Patch staging URL in email templates
        run: |
          sed -i "s|$ROY_STAGING|$PUJOL_STAGING|g" workers/email/index.ts

      - name: Patch wrangler configs for Pujol account
        run: |
          node -e "
            const fs = require('fs');

            // Main wrangler.jsonc — swap D1 ID, keep R2
            let raw = fs.readFileSync('wrangler.jsonc','utf8');
            let cfg = JSON.parse(raw.replace(/^\s*\/\/.*/gm,'').replace(/,(\s*[}\]])/g,'\$1'));
            cfg.d1_databases[0].database_id = '${{ secrets.D1_DATABASE_ID }}';
            cfg.vars = cfg.vars || {};
            for (const k of ['ADMIN_SESSION_SECRET','ADMIN_PASSWORD_HASH','UPLOAD_TOKEN']) {
              const v = process.env['INJECT_' + k];
              if (!v) { console.error('Missing secret ' + k + ' — refusing to deploy'); process.exit(1); }
              cfg.vars[k] = v;
            }
            fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2));

            // Email worker — remove hardcoded account_id, swap ALLOWED_ORIGIN
            raw = fs.readFileSync('workers/email/wrangler.jsonc','utf8');
            cfg = JSON.parse(raw.replace(/^\s*\/\/.*/gm,'').replace(/,(\s*[}\]])/g,'\$1'));
            delete cfg.account_id;
            cfg.d1_databases[0].database_id = '${{ secrets.D1_DATABASE_ID }}';
            cfg.vars.ALLOWED_ORIGIN = 'https://www.immobiliere-pujol.fr';
            cfg.vars.NEWSLETTER_REMINDER_AUTO_FROM = '2026-08-24T21:11:21Z';
            cfg.vars.ALERT_SENDER_EMAIL = 'alerte@alerte.immobiliere-pujol.fr';
            fs.writeFileSync('workers/email/wrangler.jsonc', JSON.stringify(cfg, null, 2));

            // Cron-sync worker — swap D1 ID + set production routing.
            // NEWSLETTER_INTERNAL_TOKEN stays a Worker secret and is provisioned
            // separately when Roy explicitly activates the matcher.
            raw = fs.readFileSync('workers/cron-sync/wrangler.jsonc','utf8');
            cfg = JSON.parse(raw.replace(/^\s*\/\/.*/gm,'').replace(/,(\s*[}\]])/g,'\$1'));
            cfg.d1_databases[0].database_id = '${{ secrets.D1_DATABASE_ID }}';
            cfg.vars = cfg.vars || {};
            cfg.vars.DEPLOY_WORKFLOW = 'deploy-pujol.yml';
            cfg.vars.DEPLOY_REF = 'pujol-main';
            cfg.vars.EMAIL_WORKER_URL = 'https://pujol-email.pujol.workers.dev';
            cfg.vars.SITE_BASE_URL = 'https://www.immobiliere-pujol.fr';
            const cts = process.env.INJECT_CRON_TRIGGER_SECRET;
            if (!cts) { console.error('Missing CRON_TRIGGER_SECRET — refusing to deploy'); process.exit(1); }
            cfg.vars.CRON_TRIGGER_SECRET = cts;
            fs.writeFileSync('workers/cron-sync/wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "
        env:
          INJECT_ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          INJECT_ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          INJECT_UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          INJECT_CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

      # ── Sync D1 → content ─────────────────────────────────────────────
      - name: Sync D1 annonces to content
        run: node scripts/sync-d1-to-content.mjs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Remove the staging-only X-Robots-Tag noindex header so production is
      # indexable at go-live. With ALLOW_INDEXING=true (below) and the real
      # domain live, robots.txt also flips to Allow on its own. PROD only —
      # staging (deploy.yml) keeps public/_headers untouched.
      - name: Remove staging X-Robots-Tag header (go-live)
        run: rm -f public/_headers

      # ── Build ──────────────────────────────────────────────────────────
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          ALLOW_INDEXING: "true"   # PROD only — go-live: index,follow + production robots.txt
          IMAGE_RESIZE: "true"     # PROD only — route R2 images through /cdn-cgi/image/ (zone Transformations + domain cut over 21/06)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          IMMODVISOR_API_KEY: ${{ secrets.IMMODVISOR_API_KEY }}
          IMMODVISOR_CHECKSUM_IN: ${{ secrets.IMMODVISOR_CHECKSUM_IN }}
          IMMODVISOR_CHECKSUM_OUT: ${{ secrets.IMMODVISOR_CHECKSUM_OUT }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}

      # ── Deploy all 3 workers ───────────────────────────────────────────
      - name: Deploy main worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy email worker
        working-directory: workers/email
        run: rm -rf ../../.wrangler && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy cron-sync worker
        working-directory: workers/cron-sync
        run: rm -rf ../../.wrangler && npm install && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Activate production internal tokens
        run: |
          set -euo pipefail
          if [ -z "$ALERT_INTERNAL_TOKEN" ]; then
            echo "Missing ALERT_INTERNAL_TOKEN, refusing to activate alert matching"
            exit 1
          fi
          printf '%s' "$ALERT_INTERNAL_TOKEN" | npx wrangler secret put ALERT_INTERNAL_TOKEN --name pujol-email
          printf '%s' "$ALERT_INTERNAL_TOKEN" | npx wrangler secret put ALERT_INTERNAL_TOKEN --name pujol-cron-sync
        env:
          ALERT_INTERNAL_TOKEN: ${{ secrets.ALERT_INTERNAL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── Post-deploy health check ───────────────────────────────────────
      # Emails the sync report after each prod deploy. No --daily, so it goes
      # to Roy + Kamindu only; Caroline gets the once-a-day cron report (which
      # passes --daily). continue-on-error so a report hiccup never fails deploy.
      - name: Post-deploy sync verification
        run: node scripts/sync-verify.mjs --target pujol
        continue-on-error: true
        env:
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
