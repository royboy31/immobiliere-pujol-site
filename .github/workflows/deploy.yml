name: Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync D1 annonces to content
        run: node scripts/sync-d1-to-content.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          IMMODVISOR_API_KEY: ${{ secrets.IMMODVISOR_API_KEY }}
          IMMODVISOR_CHECKSUM_IN: ${{ secrets.IMMODVISOR_CHECKSUM_IN }}
          IMMODVISOR_CHECKSUM_OUT: ${{ secrets.IMMODVISOR_CHECKSUM_OUT }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}

      - name: Deploy main worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy email worker
        working-directory: workers/email
        run: rm -rf ../../.wrangler && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure protected cron diagnostics
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('workers/cron-sync/wrangler.jsonc', 'utf8');
            const cleaned = raw.replace(/^\s*\/\/.*$/gm, '').replace(/,(\s*[}\]])/g, '\$1');
            const cfg = JSON.parse(cleaned);
            const triggerSecret = process.env.INJECT_CRON_TRIGGER_SECRET;
            if (!triggerSecret) { console.error('Missing CRON_TRIGGER_SECRET'); process.exit(1); }
            cfg.vars = cfg.vars || {};
            cfg.vars.CRON_TRIGGER_SECRET = triggerSecret;
            fs.writeFileSync('workers/cron-sync/wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "
        env:
          INJECT_CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

      - name: Deploy cron sync worker
        working-directory: workers/cron-sync
        run: rm -rf ../../.wrangler && npm install && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify cron to email Worker route
        run: |
          node -e "
            const url = 'https://pujol-cron-sync.roy-68a.workers.dev/diagnose-alert-email';
            fetch(url, { headers: { 'x-trigger-key': process.env.CRON_TRIGGER_SECRET } })
              .then(async (response) => ({ response, body: await response.json() }))
              .then(({ response, body }) => {
                console.log(JSON.stringify({ httpStatus: response.status, ...body }));
                if (!response.ok || !body.configured || !body.guardPassed || body.status !== 400) process.exit(1);
              })
              .catch((error) => { console.error(error.message); process.exit(1); });
          "
        env:
          CRON_TRIGGER_SECRET: ${{ secrets.CRON_TRIGGER_SECRET }}

      - name: Post-deploy sync verification
        run: node scripts/sync-verify.mjs --target roy --no-email
        continue-on-error: true
        env:
          OPINIONSYSTEM_API_KEY: ${{ secrets.OPINIONSYSTEM_API_KEY }}
          MANDRILL_API_KEY: ${{ secrets.MANDRILL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
